name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Full verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Install Python dependencies
        run: uv sync --frozen --all-extras --python 3.12

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/reporting/js/package-lock.json

      - name: Install report test dependencies
        run: npm ci --ignore-scripts --prefix tests/reporting/js

      - name: Run canonical verification
        run: uv run python scripts/verify.py

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: .artifacts/verification/
          if-no-files-found: ignore
          retention-days: 14

  compatibility:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --frozen --all-extras --python ${{ matrix.python }}

      - name: Run Python tests
        run: uv run pytest -q --strict-markers

  package:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Install development environment
        run: uv sync --frozen --python 3.12

      - name: Build wheel and source distribution
        run: uv build

      - name: Verify clean installation and package contents
        run: uv run python scripts/verify_packaging.py

      - name: Upload distributions and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-artifacts
          path: |
            dist/
            .artifacts/packaging/
          if-no-files-found: ignore
          retention-days: 14
